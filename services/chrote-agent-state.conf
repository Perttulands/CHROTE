# systemd-tmpfiles foundation for ADR-0014 locked-agent state.
# scripts/chrote-agent-state-init adds one target account's ACL-owned config
# directory and target-owned receipt directory beneath these roots.
d /srv/data/chrote/agent-units    0750 chrote chrote -
d /srv/data/chrote/agent-receipts 0750 chrote chrote -
