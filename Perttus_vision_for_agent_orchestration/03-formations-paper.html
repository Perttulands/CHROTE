<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CHROTE · Formations</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --paper:#ece7dc; --paper2:#e4ddcf; --card:#f4efe5;
    --ink:#211e19; --ink2:#4a463e; --dim:#827b6e; --dimmer:#a9a193;
    --line:#cdc5b4; --line2:#d8d1c2;
    --terra:#bb5a3c; --terra-d:#9c4630; --sage:#6b7d70; --gold:#b08542; --steel:#5f7488;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{font-family:'Space Grotesk',system-ui,sans-serif;background:var(--paper);color:var(--ink);overflow:hidden;
    -webkit-font-smoothing:antialiased;user-select:none;}
  img{-webkit-user-drag:none;user-drag:none;-webkit-user-select:none;user-select:none;}
  .app{display:flex;flex-direction:column;height:100vh;height:100dvh;}

  /* ===== TOP BAR ===== */
  .topbar{display:flex;align-items:center;gap:18px;padding:14px 22px;border-bottom:1px solid var(--line);background:var(--card);flex-shrink:0;z-index:30;}
  .brand{display:flex;align-items:baseline;gap:10px;}
  .brand .nm{font-family:'Newsreader';font-size:24px;letter-spacing:-.01em;}
  .brand .nm b{color:var(--terra);font-weight:500;}
  .brand .sub{font-family:'Space Mono';font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);}
  .mockpill{font-family:'Space Mono';font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--terra-d);
    background:rgba(187,90,60,.1);border:1px solid rgba(187,90,60,.35);border-radius:20px;padding:4px 10px;cursor:help;white-space:nowrap;}
  .topbar .spacer{flex:1;}
  .hint{font-family:'Space Mono';font-size:11px;color:var(--dim);letter-spacing:.02em;}
  .hint b{color:var(--ink);font-weight:400;}
  .newbtn{background:var(--ink);color:var(--paper);border:none;border-radius:22px;padding:10px 18px;font-family:'Space Grotesk';
    font-weight:500;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:8px;transition:transform .12s,background .15s;}
  .newbtn:hover{background:var(--terra-d);transform:translateY(-1px);}
  .newbtn svg{width:15px;height:15px;}

  .main{flex:1;display:flex;overflow:hidden;}

  /* ===== ROSTER ===== */
  .roster{width:212px;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;flex-shrink:0;}
  .roster-hd{padding:14px 16px 10px;}
  .roster-hd .t{font-family:'Space Mono';font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);}
  .roster-hd .s{font-size:11px;color:var(--dimmer);margin-top:3px;}
  .roster-list{flex:1;overflow-y:auto;padding:4px 10px 16px;}
  .ragent{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;cursor:grab;transition:background .12s;position:relative;touch-action:none;}
  .ragent:hover{background:var(--paper2);}
  .ragent:active{cursor:grabbing;}
  .ragent.deployed{opacity:.66;}
  .ragent .av{width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid var(--card);box-shadow:0 4px 10px -5px rgba(50,40,25,.5);flex-shrink:0;}
  .ragent .av.blank{display:flex;align-items:center;justify-content:center;color:var(--dimmer);font-family:'Newsreader';background:var(--paper2);}
  .ragent img{-webkit-user-drag:none;user-drag:none;}
  .ragent .ri{min-width:0;}
  .ragent .ri .n{font-family:'Space Mono';font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ragent .ri .r{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-top:2px;}
  .ragent .sd{position:absolute;right:9px;top:11px;width:8px;height:8px;border-radius:50%;}
  .ragent .sd.on{background:var(--sage);} .ragent .sd.idle{background:var(--dimmer);}

  /* ===== BOARD (infinite canvas) ===== */
  .viewport{flex:1;position:relative;overflow:hidden;cursor:grab;background:var(--paper);}
  .viewport.panning{cursor:grabbing;}
  .world{position:absolute;top:0;left:0;width:3400px;height:2300px;transform-origin:0 0;
    background-image:radial-gradient(circle at 1px 1px, var(--line) 1.1px, transparent 0);background-size:28px 28px;}
  .world.smooth{transition:transform .35s cubic-bezier(.2,.7,.3,1);}
  .zoomctl{position:fixed;bottom:18px;right:18px;z-index:80;display:flex;flex-direction:column;background:var(--card);
    border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 10px 26px -14px rgba(60,50,35,.4);}
  .zoomctl button{width:40px;height:38px;background:transparent;border:none;border-bottom:1px solid var(--line2);
    color:var(--dim);cursor:pointer;font-size:16px;font-family:'Space Grotesk';transition:all .12s;}
  .zoomctl button:last-child{border-bottom:none;font-size:9px;letter-spacing:.06em;}
  .zoomctl button:hover{background:var(--paper2);color:var(--ink);}
  .zoomlevel{position:fixed;bottom:18px;right:66px;z-index:80;background:var(--card);border:1px solid var(--line);
    border-radius:9px;padding:8px 11px;font-family:'Space Mono';font-size:11px;color:var(--dim);box-shadow:0 10px 26px -14px rgba(60,50,35,.4);}

  /* ===== FORMATION CARD ===== */
  .formation{position:absolute;background:var(--card);border:1px solid var(--line);border-radius:18px;
    box-shadow:0 22px 50px -26px rgba(50,40,25,.5),0 2px 6px rgba(50,40,25,.05);min-width:200px;z-index:1;}
  .formation.running{box-shadow:0 22px 50px -22px rgba(187,90,60,.4),0 0 0 1.5px var(--terra);}
  .fhead{display:flex;align-items:center;gap:10px;padding:13px 15px 12px;border-bottom:1px solid var(--line2);cursor:grab;touch-action:none;}
  .fhead:active{cursor:grabbing;}
  .fhead .ft{flex:1;min-width:0;}
  .fhead .ft .tt{font-family:'Newsreader';font-size:18px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .fhead .ft .tg{font-family:'Space Mono';font-size:9.5px;color:var(--dim);margin-top:4px;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .frun{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--paper);color:var(--terra);
    cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .14s;}
  .frun:hover{background:var(--terra);color:var(--paper);border-color:var(--terra);}
  .frun svg{width:12px;height:12px;}
  .fstatus{font-family:'Space Mono';font-size:9.5px;color:var(--terra);padding:0 15px 10px;min-height:0;letter-spacing:.03em;}
  .fstatus:empty{padding:0;}
  .fbody{padding:18px 20px 20px;cursor:grab;}
  .formation:active .fbody{cursor:grabbing;}

  /* slots */
  .slot{display:flex;flex-direction:column;align-items:center;gap:7px;width:84px;}
  .slot-ring{width:62px;height:62px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;
    transition:transform .16s,box-shadow .16s;}
  .slot.empty .slot-ring{border:2px dashed var(--line);background:rgba(0,0,0,0.015);}
  .slot.empty .slot-ring .plus{color:var(--dimmer);font-size:20px;font-weight:300;}
  .slot.filled .slot-ring{padding:3px;background:radial-gradient(var(--sage),#56685c);}
  .slot.filled.ctrl .slot-ring{background:radial-gradient(var(--gold),#8a6526);}
  .slot.empty.ctrl .slot-ring{border-color:var(--gold);}
  .slot-ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:2.5px solid var(--card);-webkit-user-drag:none;display:block;}
  .slot.snap .slot-ring{transform:scale(1.14);box-shadow:0 0 0 3px var(--terra),0 0 0 9px rgba(187,90,60,.16);border-style:solid;border-color:var(--terra);}
  .slot.just .slot-ring{animation:pop .34s cubic-bezier(.2,1.4,.4,1);}
  @keyframes pop{0%{transform:scale(.6);}60%{transform:scale(1.12);}100%{transform:scale(1);}}
  .slot.active .slot-ring{box-shadow:0 0 0 3px var(--terra),0 0 22px -2px rgba(187,90,60,.6);}
  .slot.active.done .slot-ring{box-shadow:0 0 0 3px var(--sage);}
  .slot-label{font-family:'Space Mono';font-size:10px;color:var(--ink2);text-align:center;letter-spacing:.02em;max-width:92px;line-height:1.25;}
  .slot.empty .slot-label{color:var(--dim);}
  .slot .who{font-size:8.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);}
  .slot-ring .badge{position:absolute;left:-3px;top:-3px;width:19px;height:19px;border-radius:50%;background:var(--steel);color:#fff;
    font-family:'Space Mono';font-size:10px;display:flex;align-items:center;justify-content:center;border:2px solid var(--card);z-index:2;}

  /* flow layout */
  .flow-row{display:flex;align-items:flex-start;gap:6px;}
  .flow-arrow{align-self:center;margin-top:-18px;color:var(--steel);display:flex;align-items:center;}
  .flow-arrow svg{width:26px;height:12px;}
  .flow-arrow.lit svg{color:var(--terra);}

  /* peer huddle */
  .huddle{border:1.5px dashed var(--sage);border-radius:16px;padding:16px 16px 12px;position:relative;background:rgba(107,125,112,.05);}
  .huddle .hl{position:absolute;top:-9px;left:16px;background:var(--card);padding:0 8px;font-family:'Space Mono';font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--sage);}
  .huddle.running{border-style:solid;animation:huddlepulse 1.2s ease-in-out infinite;}
  @keyframes huddlepulse{0%,100%{border-color:var(--sage);}50%{border-color:var(--terra);}}
  .peers-row{display:flex;gap:14px;align-items:flex-start;}

  /* orchestrated */
  .orch{display:flex;flex-direction:column;align-items:center;gap:16px;}
  .orch .ctrl-wrap{display:flex;flex-direction:column;align-items:center;}
  .orch .assign{font-family:'Space Mono';font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin:9px 0 4px;display:flex;align-items:center;gap:5px;}
  .orch .assign svg{width:11px;height:11px;}
  .pool{border:1.5px dashed var(--line);border-radius:14px;padding:14px 14px 12px;display:flex;gap:12px;align-items:flex-start;position:relative;background:rgba(0,0,0,0.012);}
  .pool .pl{position:absolute;top:-9px;left:14px;background:var(--card);padding:0 8px;font-family:'Space Mono';font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);}

  /* solo */
  .solo-body{display:flex;justify-content:center;}

  /* ===== I/O PORTS + ROWS ===== */
  .port{position:absolute;width:16px;height:16px;border-radius:50%;background:var(--card);border:2px solid var(--dim);
    cursor:crosshair;z-index:6;transition:transform .14s,border-color .14s,background .14s;}
  .port:hover{transform:scale(1.25);border-color:var(--terra);}
  .port.pin{left:-9px;top:50%;margin-top:-8px;}
  .port.pout{right:-9px;top:50%;margin-top:-8px;}
  .port.pin.has{background:var(--steel);border-color:var(--steel);}
  .port.pout.ready{background:var(--terra);border-color:var(--terra);}
  .port.pout.empty{opacity:.55;}
  .port.snaptarget{transform:scale(1.4);border-color:var(--terra);background:var(--terra);box-shadow:0 0 0 6px rgba(187,90,60,.18);}
  .fio{display:flex;align-items:center;gap:8px;padding:8px 15px;cursor:pointer;position:relative;}
  .fio.in{border-bottom:1px solid var(--line2);}
  .fio.out{border-top:1px solid var(--line2);}
  .fio .glyph{font-family:'Space Mono';font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);flex-shrink:0;}
  .fio.in:hover,.fio.out:hover{background:var(--paper2);}
  .io-text{flex:1;min-width:0;max-width:240px;font-size:11.5px;color:var(--ink2);line-height:1.32;
    overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
  .io-text.placeholder{color:var(--dimmer);font-style:italic;}
  .io-bead{font-family:'Space Mono';font-size:10px;color:var(--steel);background:rgba(95,116,136,.12);border:1px solid rgba(95,116,136,.3);border-radius:10px;padding:1px 7px;flex-shrink:0;}
  .io-status{font-family:'Space Mono';font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;padding:2px 9px;border-radius:10px;flex-shrink:0;}
  .io-status.done{color:var(--sage);background:rgba(107,125,112,.14);}
  .io-status.review{color:var(--gold);background:rgba(176,133,66,.14);}
  .io-status.blocked{color:var(--terra-d);background:rgba(187,90,60,.14);}
  .io-status.idle{color:var(--dimmer);background:rgba(0,0,0,.04);}

  /* ===== VERIFICATION BAND (inside a formation, between body & output) ===== */
  .verify-band{display:flex;align-items:center;gap:9px;padding:9px 15px;border-top:1px dashed var(--line);
    cursor:pointer;transition:background .12s,opacity .18s;}
  .verify-band:hover{background:var(--paper2);}
  .verify-band.empty{opacity:0;pointer-events:none;}
  .formation:hover .verify-band.empty{opacity:.45;pointer-events:auto;}
  .formation:hover .verify-band.empty:hover{opacity:.9;}
  .vico{width:23px;height:23px;border-radius:50%;border:1.5px solid var(--sage);display:flex;align-items:center;justify-content:center;
    color:var(--sage);flex-shrink:0;transition:transform .16s,border-color .16s,background .16s,color .16s;}
  .verify-band.empty .vico{border-style:dashed;border-color:var(--dimmer);color:var(--dimmer);}
  .vico svg{width:13px;height:13px;}
  .vlabel{font-family:'Space Mono';font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--sage);flex-shrink:0;}
  .verify-band.empty .vlabel{color:var(--dim);}
  .vkinds{font-size:11px;color:var(--ink2);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .vbadge{flex-shrink:0;}
  /* the verification's fail-policy badge sits inline at the right of the band, not on the card corner */
  .verify-band .gate-badge{position:static;right:auto;bottom:auto;margin-left:2px;}

  /* wires */
  .wires{position:absolute;top:0;left:0;width:3400px;height:2300px;z-index:0;pointer-events:none;overflow:visible;}
  .wires path.wirehit{fill:none;stroke:transparent;stroke-width:18;pointer-events:stroke;cursor:grab;}
  .wires path.wire{fill:none;stroke:var(--steel);stroke-width:2;pointer-events:stroke;cursor:grab;}
  .wires path.wire:hover{stroke:var(--terra);stroke-width:3;}
  .wires path.wirehit:active{cursor:grabbing;}
  .wires path.wire.flowing{stroke:var(--terra);stroke-dasharray:7 7;animation:dash 0.6s linear infinite;}
  @keyframes dash{to{stroke-dashoffset:-28;}}
  .wires path.temp{stroke:var(--terra);stroke-dasharray:5 5;}

  /* ===== MISSION (entry point) ===== */
  .missioncard{position:absolute;width:236px;background:var(--card);border:1.5px solid var(--terra);border-radius:16px;
    box-shadow:0 22px 50px -26px rgba(187,90,60,.5),0 2px 6px rgba(50,40,25,.06);z-index:1;cursor:grab;}
  .missioncard:active{cursor:grabbing;}
  .missioncard .mhd{display:flex;align-items:center;gap:10px;padding:12px 14px 6px;}
  .missioncard .meyebrow{flex:1;font-family:'Space Mono';font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--terra-d);}
  .missioncard .mrun{width:30px;height:30px;border-radius:50%;border:none;background:var(--terra);color:var(--paper);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .12s,background .15s;}
  .missioncard .mrun:hover{background:var(--terra-d);transform:translateY(-1px);}
  .missioncard .mrun svg{width:12px;height:12px;margin-left:1px;}
  .missioncard .mtitle{font-family:'Newsreader';font-size:21px;padding:0 14px;line-height:1.08;}
  .missioncard .mgoal{font-size:11.5px;color:var(--ink2);padding:6px 14px 0;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .missioncard .mgoal.placeholder{font-style:italic;color:var(--dimmer);}
  .missioncard .mstatus{font-family:'Space Mono';font-size:9.5px;color:var(--terra);padding:8px 14px 12px;letter-spacing:.03em;}
  .missioncard .mstatus:empty{padding:0 0 14px;}
  .missioncard .port.pout{right:-9px;top:50%;margin-top:-8px;border-color:var(--terra);}
  .missioncard .port.pout:hover{background:var(--terra);}
  /* mission panel step list */
  .mp-list{display:flex;flex-direction:column;gap:5px;max-height:230px;overflow:auto;}
  .mp-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;font-size:12.5px;background:var(--paper2);}
  .mp-dot{width:8px;height:8px;border-radius:50%;background:var(--dimmer);flex-shrink:0;}
  .mp-dot.done,.mp-dot.pass{background:var(--sage);} .mp-dot.review,.mp-dot.needs-review,.mp-dot.evaluating{background:var(--gold);} .mp-dot.blocked,.mp-dot.fail{background:var(--terra);}
  .mp-t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .mp-k{font-family:'Space Mono';font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);}
  .mp-empty{font-size:12px;color:var(--dim);line-height:1.5;}
  .gatecard{position:absolute;display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
    border-radius:20px;padding:11px 62px 11px 11px;box-shadow:0 18px 40px -24px rgba(50,40,25,.55),0 1px 3px rgba(50,40,25,.05);
    min-width:150px;max-width:300px;min-height:76px;z-index:1;cursor:grab;transition:box-shadow .16s;}
  .gatecard:active{cursor:grabbing;}
  .gatecard:hover{box-shadow:0 22px 46px -22px rgba(50,40,25,.5),0 0 0 1px var(--line);}
  .gico{width:46px;height:46px;border-radius:50%;background:var(--paper);border:2px solid var(--dim);display:flex;align-items:center;
    justify-content:center;color:var(--ink2);position:relative;flex-shrink:0;transition:transform .16s,border-color .16s,background .16s,color .16s;}
  .gico svg{width:23px;height:23px;}
  .gatecard:hover .gico{transform:scale(1.05);border-color:var(--terra);}
  .gmeta{min-width:0;display:flex;flex-direction:column;gap:2px;}
  .gmeta .gt{font-family:'Space Mono';font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px;}
  .gmeta .gs{font-size:10.5px;color:var(--dim);line-height:1.32;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;max-width:150px;}

  /* gate: pass (upper) + fail (lower) outputs */
  .gatecard .port.pass{right:-9px;top:50%;margin-top:-21px;border-color:var(--sage);background:var(--card);}
  .gatecard .port.fail{right:-9px;top:50%;margin-top:5px;border-color:var(--terra);background:var(--card);}
  .gatecard .port.pass:hover,.gatecard .port.pass.snaptarget{background:var(--sage);transform:scale(1.3);}
  .gatecard .port.fail:hover,.gatecard .port.fail.snaptarget{background:var(--terra);transform:scale(1.3);}
  .glabel{position:absolute;right:16px;font-family:'Space Mono';font-size:8px;letter-spacing:.12em;text-transform:uppercase;pointer-events:none;display:flex;align-items:center;gap:3px;line-height:1;}
  .glabel svg{width:9px;height:9px;}
  .glabel.pass{top:50%;margin-top:-13px;transform:translateY(-50%);color:var(--sage);}
  .glabel.fail{top:50%;margin-top:13px;transform:translateY(-50%);color:var(--terra-d);}
  /* gate: judge connector (top center) */
  .pjudge{position:absolute;left:50%;top:-13px;transform:translateX(-50%);width:22px;height:22px;border-radius:50%;border:1.5px dashed var(--gold);
    background:var(--paper);color:var(--gold);display:flex;align-items:center;justify-content:center;font-size:15px;line-height:1;cursor:pointer;
    z-index:7;padding:0;font-family:'Space Grotesk';transition:all .14s;}
  .pjudge:hover{background:var(--gold);color:#fff;border-style:solid;transform:translateX(-50%) scale(1.18);}
  .pjudge.snaptarget{background:var(--gold);color:#fff;border-style:solid;transform:translateX(-50%) scale(1.3);box-shadow:0 0 0 6px rgba(176,133,66,.2);}
  .gatecard.hasjudge .pjudge{border-style:solid;background:var(--gold);color:#fff;}
  .formation.judgehover{outline:2px dashed var(--gold);outline-offset:3px;}
  .route-note{font-size:11px;color:var(--ink2);line-height:1.55;background:var(--paper2);border:1px solid var(--line);border-radius:9px;padding:9px 11px;}
  /* branch + judge wire colors (re-declare flowing last so it wins) */
  .wires path.wire.pass{stroke:var(--sage);}
  .wires path.wire.fail{stroke:var(--terra-d);}
  .wires path.wire.judge{stroke:var(--gold);stroke-dasharray:3 5;stroke-width:1.8;}
  .wires path.wire.pass:hover,.wires path.wire.fail:hover,.wires path.wire.judge:hover{stroke:var(--terra);}
  .wires path.wire.flowing{stroke:var(--terra);stroke-dasharray:7 7;}

  /* fail-policy badge (shared: gate node + verification) */
  .gate-badge{position:absolute;right:-4px;bottom:-4px;width:18px;height:18px;border-radius:50%;background:var(--ink);color:var(--paper);
    font-size:10px;display:flex;align-items:center;justify-content:center;border:2px solid var(--card);}
  .gate-badge.pb{background:var(--gold);} .gate-badge.bl{background:var(--terra-d);}

  /* run states — shared by gate nodes and verification bands */
  [data-gate].evaluating .gico,[data-gate].evaluating .vico{animation:gpulse .7s ease-in-out infinite;border-color:var(--terra);color:var(--terra-d);border-style:solid;}
  [data-gate].pass .gico,[data-gate].pass .vico{border-color:var(--sage);background:rgba(107,125,112,.14);color:var(--sage);border-style:solid;}
  [data-gate].fail .gico,[data-gate].fail .vico{border-color:var(--terra);background:rgba(187,90,60,.14);color:var(--terra-d);border-style:solid;}
  @keyframes gpulse{0%,100%{box-shadow:0 0 0 0 rgba(187,90,60,.4);}50%{box-shadow:0 0 0 8px rgba(187,90,60,0);}}

  /* gate drag ghost + topbar token */
  .gateghost{position:fixed;z-index:400;pointer-events:none;width:46px;height:46px;border-radius:50%;background:var(--card);
    border:2px solid var(--terra);display:flex;align-items:center;justify-content:center;color:var(--terra);
    box-shadow:0 16px 30px -10px rgba(40,32,20,.6);transform:translate(-50%,-50%);}
  .gateghost svg{width:23px;height:23px;}
  .gatetoken{display:flex;align-items:center;gap:7px;font-family:'Space Mono';font-size:10px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--ink2);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:7px 13px;cursor:grab;touch-action:none;transition:all .14s;}
  .gatetoken:hover{border-color:var(--terra);color:var(--terra-d);}
  .gatetoken:active{cursor:grabbing;}
  .gatetoken svg{width:14px;height:14px;color:var(--terra);}

  /* ===== GATE / VERIFICATION CONFIG ===== */
  .gate-kinds{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;}
  .gk{display:flex;flex-direction:column;align-items:center;gap:6px;padding:11px 4px;border:1px solid var(--line);border-radius:10px;cursor:pointer;font-family:'Space Mono';font-size:8.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--dim);text-align:center;transition:all .12s;}
  .gk svg{width:18px;height:18px;color:var(--dim);}
  .gk:hover{border-color:var(--dimmer);} .gk.sel{border-color:var(--terra);color:var(--ink);background:rgba(187,90,60,.06);} .gk.sel svg{color:var(--terra);}
  .radio-row{display:flex;gap:8px;}
  .radio-opt{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px 11px;cursor:pointer;transition:all .12s;}
  .radio-opt.sel{border-color:var(--terra);background:rgba(187,90,60,.06);}
  .radio-opt .t{font-weight:500;font-size:12.5px;} .radio-opt .d{font-size:10px;color:var(--dim);margin-top:3px;font-family:'Space Mono';line-height:1.4;}
  .verdict-row{display:flex;gap:8px;}
  .vbtn{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;font-family:'Space Mono';font-size:11px;text-align:center;letter-spacing:.04em;transition:all .12s;}
  .vbtn.sel.pass{border-color:var(--sage);background:rgba(107,125,112,.12);color:var(--sage);}
  .vbtn.sel.fail{border-color:var(--terra);background:rgba(187,90,60,.12);color:var(--terra-d);}
  .vbtn .note{display:block;font-size:8px;color:var(--dimmer);margin-top:3px;text-transform:uppercase;letter-spacing:.1em;}

  /* input editor / report popups */
  .pop{position:fixed;z-index:170;background:var(--card);border:1px solid var(--line);border-radius:15px;
    box-shadow:0 30px 64px -26px rgba(50,40,25,.55);overflow:hidden;display:flex;flex-direction:column;width:360px;}
  .pop-head{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line2);cursor:grab;touch-action:none;}
  .pop-head .pt{flex:1;font-family:'Newsreader';font-size:18px;}
  .pop-head .x{background:none;border:none;color:var(--dimmer);font-size:19px;cursor:pointer;width:24px;height:24px;border-radius:6px;}
  .pop-head .x:hover{color:var(--terra);background:var(--paper2);}
  .pop-body{padding:14px 16px 16px;overflow:auto;max-height:62vh;}
  .pop-body label{display:block;font-family:'Space Mono';font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:12px 0 6px;}
  .pop-body label:first-child{margin-top:0;}
  .pop-body textarea,.pop-body input.f{width:100%;background:var(--paper2);border:1px solid var(--line);border-radius:9px;
    padding:9px 11px;font-family:'Space Grotesk';font-size:13px;color:var(--ink);outline:none;resize:vertical;}
  .pop-body textarea:focus,.pop-body input.f:focus{border-color:var(--terra);}
  .pop-body textarea{min-height:62px;line-height:1.45;}
  .chiprow{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px;}
  .chip-i{display:flex;align-items:center;gap:6px;font-family:'Space Mono';font-size:11px;background:var(--paper2);border:1px solid var(--line);border-radius:9px;padding:4px 9px;}
  .chip-i b{font-weight:400;color:var(--ink2);} .chip-i .rm{cursor:pointer;color:var(--dimmer);} .chip-i .rm:hover{color:var(--terra);}
  .addrow{display:flex;gap:6px;margin-top:7px;}
  .addrow input{flex:1;}
  .addrow button,.pop .save{background:var(--ink);color:var(--paper);border:none;border-radius:9px;padding:9px 14px;font-family:'Space Grotesk';font-size:12px;font-weight:500;cursor:pointer;}
  .addrow button{padding:9px 12px;}
  .pop .save{width:100%;margin-top:16px;}
  .pop .save:hover{background:var(--terra-d);}
  /* report */
  .rpt-status{display:inline-flex;align-items:center;gap:7px;font-family:'Space Mono';font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:5px 11px;border-radius:11px;}
  .rpt-section{font-family:'Space Mono';font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:16px 0 7px;}
  .rpt-body{font-size:13px;line-height:1.6;color:var(--ink2);}
  .rpt-art{display:flex;align-items:center;gap:9px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;margin-bottom:6px;font-size:12.5px;}
  .rpt-art .ai{width:14px;height:14px;color:var(--steel);flex-shrink:0;}
  .rpt-art .at{font-family:'Space Mono';font-size:9px;color:var(--dim);margin-left:auto;text-transform:uppercase;letter-spacing:.06em;}
  .diff{font-family:'Space Mono';font-size:11px;line-height:1.55;background:#1f1c18;border-radius:10px;padding:11px 13px;overflow-x:auto;color:#cabfa9;}
  .diff .dh{color:#8a8170;} .diff .da{color:#7fb88f;background:rgba(127,184,143,.08);display:block;} .diff .dd{color:#cf8a78;background:rgba(207,138,120,.08);display:block;} .diff .dc{color:#9b9586;display:block;}

  /* context menu */
  .ctxmenu{position:fixed;z-index:200;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:5px;
    box-shadow:0 20px 44px -18px rgba(40,32,20,.5);min-width:178px;}
  .ctxmenu .mhead{font-family:'Space Mono';font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--dimmer);padding:7px 10px 5px;}
  .ctxmenu .mi{display:flex;align-items:center;gap:10px;padding:8px 11px;border-radius:7px;cursor:pointer;font-size:13px;color:var(--ink);transition:background .1s;}
  .ctxmenu .mi:hover{background:var(--paper2);}
  .ctxmenu .mi .mic{width:15px;height:15px;color:var(--dim);flex-shrink:0;}
  .ctxmenu .mi .mimg{width:20px;height:20px;border-radius:50%;object-fit:cover;flex-shrink:0;border:1px solid var(--line);}
  .ctxmenu .mi .dot{width:9px;height:9px;border-radius:3px;flex-shrink:0;}
  .ctxmenu .mi.danger{color:var(--terra-d);} .ctxmenu .mi.danger .mic{color:var(--terra-d);}
  .ctxmenu .mdiv{height:1px;background:var(--line2);margin:5px 6px;}
  .ctxmenu .mi .sm{margin-left:auto;font-family:'Space Mono';font-size:9px;color:var(--dimmer);}

  /* drag ghost */
  .ghost{position:fixed;z-index:300;width:58px;height:58px;border-radius:50%;pointer-events:none;
    box-shadow:0 16px 30px -10px rgba(40,32,20,.6);transform:translate(-50%,-50%) scale(1.05);opacity:.95;}
  .ghost img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:3px solid var(--card);}

  /* terminal popup — lives ON the board (inside #world), pans & zooms with it */
  .term{position:absolute;z-index:50;width:330px;background:var(--card);border:1px solid var(--line);border-radius:15px;
    box-shadow:0 30px 64px -26px rgba(50,40,25,.55);overflow:hidden;display:flex;flex-direction:column;}
  .term-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line2);cursor:grab;touch-action:none;}
  .term-head img{width:30px;height:30px;border-radius:8px;object-fit:cover;}
  .term-head .ti{flex:1;min-width:0;}
  .term-head .ti .n{font-family:'Newsreader';font-size:17px;line-height:1;}
  .term-head .ti .r{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-top:3px;}
  .term-head .x{background:none;border:none;color:var(--dimmer);font-size:19px;cursor:pointer;width:24px;height:24px;border-radius:6px;}
  .term-head .x:hover{color:var(--terra);background:var(--paper2);}
  .term-body{flex:1;overflow:auto;padding:13px 15px;font-family:'Space Mono';font-size:11.5px;line-height:1.8;background:var(--paper2);}
  .term .resize-handle{position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize;z-index:3;touch-action:none;}
  .term .resize-handle::after{content:"";position:absolute;right:4px;bottom:4px;width:8px;height:8px;border-right:2px solid var(--dimmer);border-bottom:2px solid var(--dimmer);border-radius:0 0 3px 0;opacity:.7;}
  .term-body .l{display:block;color:var(--ink2);} .term-body .pmt{color:var(--terra);font-weight:700;} .term-body .ok{color:var(--sage);} .term-body .mut{color:var(--dimmer);}
  .pcur{display:inline-block;width:7px;height:12px;background:var(--terra);vertical-align:-2px;animation:bl 1.1s steps(1) infinite;}
  @keyframes bl{50%{opacity:0;}}

  .hublink{position:fixed;bottom:16px;left:228px;z-index:80;font-family:'Space Mono';font-size:11px;color:var(--dimmer);
    text-decoration:none;background:var(--card);border:1px solid var(--line);padding:7px 13px;border-radius:20px;transition:all .15s;}
  .hublink:hover{color:var(--terra);border-color:var(--terra);}
  ::-webkit-scrollbar{width:10px;height:10px;}::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px;}::-webkit-scrollbar-track{background:transparent;}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand"><span class="nm">CHR<b>O</b>TE</span><span class="sub">Formations</span></div>
    <span class="mockpill" title="This is a design prototype. All agents, terminals, runs and reports are mocked — see the handoff notes at the top of 03-formations.js.">◌ MOCK DATA</span>
    <div class="spacer"></div>
    <div class="hint">drag agents into slots · <b>right-click</b> anything · <b>▶</b> runs a formation · <b>⌘Z</b> undo</div>
    <div class="gatetoken" id="gateToken" title="Drag onto the canvas to drop a gate between formations (or click to add one)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 11V7a7 7 0 0114 0v4"/><rect x="4" y="11" width="16" height="9" rx="2"/></svg>Gate</div>
    <button class="newbtn" id="newBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>New formation</button>
  </div>
  <div class="main">
    <aside class="roster">
      <div class="roster-hd"><div class="t">Agent roster</div><div class="s" id="rosterSub">8 agents on the socket</div></div>
      <div class="roster-list" id="rosterList"></div>
    </aside>
    <div class="viewport" id="viewport">
      <div class="world" id="world"><svg class="wires" id="wires"></svg></div>
    </div>
  </div>
</div>

<div class="zoomlevel" id="zoomLevel">100%</div>
<div class="zoomctl">
  <button id="zoomIn">+</button>
  <button id="zoomOut">−</button>
  <button id="zoomFit">FIT</button>
</div>
