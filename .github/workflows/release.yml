name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  checks: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Release admission
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release-admission.sh

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache-dependency-path: src/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Documentation contract
        run: python3 scripts/doc-lint.py

      - name: Host neutrality
        run: python3 scripts/host-neutrality.py

      - name: Python checks
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 -m unittest discover -s scripts/tmux-recovery -p 'test_*.py'

      - name: Verify tag matches VERSION
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          source_version="$(tr -d '\r\n' < VERSION)"
          if [ "$source_version" != "$release_version" ]; then
            printf 'VERSION %s does not match tag %s\n' "$source_version" "$GITHUB_REF_NAME"
            exit 1
          fi
          if [ "$release_version" != "$RELEASE_VERSION" ]; then
            printf 'admitted release version %s does not match tag %s\n' "$RELEASE_VERSION" "$release_version"
            exit 1
          fi

      - name: Dashboard quality
        run: |
          cd dashboard
          npm ci
          npm run lint
          npm run test:unit -- --coverage
          npm audit --audit-level=moderate

      - name: Dashboard build embedded assets
        run: ./scripts/build-embedded-dashboard.sh

      - name: Go format
        run: |
          cd src
          unformatted="$(gofmt -l $(find . -name '*.go' -not -path './vendor/*'))"
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi

      - name: Go vet
        run: |
          cd src
          go vet ./...

      - name: Go tests
        run: |
          cd src
          go test ./...

      - name: Go race tests
        run: |
          cd src
          go test -race ./...

      - name: Go vulnerability scan
        run: |
          cd src
          go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Build publication candidates
        # The script applies -X main.Version=$release_version and the admitted commit.
        run: bash scripts/build-release-candidates.sh

      - name: Verify publication provenance
        run: |
          for binary in dist/chrote-server-linux-amd64 dist/chrote-server-linux-arm64; do
            metadata="$(go version -m "$binary")"
            printf '%s\n' "$metadata"
            grep -Fq "vcs.revision=$RELEASE_COMMIT" <<<"$metadata"
            grep -Fq 'vcs.modified=false' <<<"$metadata"
          done

      - name: Scan release binaries
        run: |
          cd src
          go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 -mode=binary ../dist/chrote-server-linux-amd64
          go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 -mode=binary ../dist/chrote-server-linux-arm64

      - name: Smoke release installer contract
        run: CHROTE_EXPECTED_BUILD_COMMIT="$RELEASE_COMMIT" ./scripts/test-public-install.sh dist/chrote-server-linux-amd64

      - name: Generate checksums
        run: |
          cd dist
          sha256sum chrote-server-linux-amd64 chrote-server-linux-arm64 > SHA256SUMS

      - name: Verify publication checksums
        run: |
          cd dist
          sha256sum --check SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/chrote-server-linux-amd64
            dist/chrote-server-linux-arm64
            dist/SHA256SUMS
          generate_release_notes: true
