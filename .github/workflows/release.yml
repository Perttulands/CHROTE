name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Dashboard quality
        run: |
          cd dashboard
          npm ci
          npm run lint
          npm run build
          npm run test:unit -- --coverage
          npm audit --audit-level=moderate
          rm -rf ../src/internal/dashboard/dist
          cp -r dist ../src/internal/dashboard/

      - name: Go format
        run: |
          cd src
          unformatted="$(gofmt -l $(find . -name '*.go' -not -path './vendor/*'))"
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi

      - name: Go vet
        run: |
          cd src
          go vet ./...

      - name: Go tests
        run: |
          cd src
          go test ./...

      - name: Go race tests
        run: |
          cd src
          go test -race ./...

      - name: Embedded dashboard smoke
        run: |
          cd src
          go test ./...
          go build -o /tmp/chrote-server-release-smoke ./cmd/server

      # Build Go binaries for multiple architectures
      - name: Build Binaries
        run: |
          mkdir -p dist
          cd src
          GOOS=linux GOARCH=amd64 go build -o ../dist/chrote-server-linux-amd64 ./cmd/server
          GOOS=linux GOARCH=arm64 go build -o ../dist/chrote-server-linux-arm64 ./cmd/server

      # Create GitHub release with binaries
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/chrote-server-linux-amd64
            dist/chrote-server-linux-arm64
            install.sh
            uninstall.sh
          generate_release_notes: true
