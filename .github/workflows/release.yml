name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache-dependency-path: src/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Documentation contract
        run: python3 scripts/doc-lint.py

      - name: Host neutrality
        run: python3 scripts/host-neutrality.py

      - name: Python checks
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 -m unittest discover -s scripts/tmux-recovery -p 'test_*.py'

      - name: Verify tag matches VERSION
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          source_version="$(tr -d '\r\n' < VERSION)"
          if [ "$source_version" != "$release_version" ]; then
            printf 'VERSION %s does not match tag %s\n' "$source_version" "$release_version"
            exit 1
          fi

      - name: Dashboard quality
        run: |
          cd dashboard
          npm ci
          npm run lint
          npm run test:unit -- --coverage
          npm audit --audit-level=moderate

      - name: Dashboard build embedded assets
        run: ./scripts/build-embedded-dashboard.sh

      - name: Go format
        run: |
          cd src
          unformatted="$(gofmt -l $(find . -name '*.go' -not -path './vendor/*'))"
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi

      - name: Go vet
        run: |
          cd src
          go vet ./...

      - name: Go tests
        run: |
          cd src
          go test ./...

      - name: Go race tests
        run: |
          cd src
          go test -race ./...

      - name: Go vulnerability scan
        run: |
          cd src
          go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Embedded dashboard smoke
        run: |
          cd src
          go test ./...
          release_version="${GITHUB_REF_NAME#v}"
          go build -trimpath -ldflags "-X main.Version=$release_version -X main.BuildCommit=$GITHUB_SHA" -o /tmp/chrote-server-release-smoke ./cmd/server

      # Build Go binaries for multiple architectures
      - name: Build Binaries
        run: |
          mkdir -p dist
          cd src
          release_version="${GITHUB_REF_NAME#v}"
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-X main.Version=$release_version -X main.BuildCommit=$GITHUB_SHA" -o ../dist/chrote-server-linux-amd64 ./cmd/server
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-X main.Version=$release_version -X main.BuildCommit=$GITHUB_SHA" -o ../dist/chrote-server-linux-arm64 ./cmd/server

      - name: Scan release binaries
        run: |
          cd src
          go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 -mode=binary ../dist/chrote-server-linux-amd64
          go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 -mode=binary ../dist/chrote-server-linux-arm64

      - name: Smoke release installer contract
        run: ./scripts/test-public-install.sh /tmp/chrote-server-release-smoke

      - name: Generate checksums
        run: |
          cd dist
          sha256sum chrote-server-linux-amd64 chrote-server-linux-arm64 > SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/chrote-server-linux-amd64
            dist/chrote-server-linux-arm64
            dist/SHA256SUMS
          generate_release_notes: true
