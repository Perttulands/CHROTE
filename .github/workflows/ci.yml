name: CI

on:
  push:
    branches: [main, master]
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  quality:
    runs-on: ubuntu-latest
    # The job measured 4m22s against the previous 5m cap, so a new step would
    # have started failing on time rather than on truth.
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache-dependency-path: src/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard and Chromium
        run: |
          npm ci --prefix dashboard
          cd dashboard
          npx playwright install --with-deps chromium

      - name: Build embedded dashboard and server
        run: |
          ./scripts/build-embedded-dashboard.sh
          cd src
          go build -trimpath -o ../chrote-server-ci ./cmd/server

      - name: Go format and vet
        run: |
          cd src
          unformatted="$(gofmt -l $(find . -name '*.go' -not -path './vendor/*'))"
          test -z "$unformatted" || { printf '%s\n' "$unformatted"; exit 1; }
          go vet ./...

      - name: Go race tests
        run: cd src && go test -race ./...

      - name: Dashboard unit, lint, and browser tests
        run: |
          cd dashboard
          npm run test:unit
          npm run lint
          npm test

      - name: Source contracts
        run: |
          python3 scripts/doc-lint.py
          python3 scripts/host-neutrality.py
          python3 scripts/check-embedded-dashboard.py

      - name: Built server browser and API contract
        env:
          CHROTE_CONTRACT_ARTIFACT_DIR: ${{ runner.temp }}/chrote-contract
          CHROTE_SERVER_BINARY: ${{ github.workspace }}/chrote-server-ci
        run: ./scripts/test-built-server-contract.sh

      # Runs on every push, not only on installer changes. What this smoke
      # covers is the installed product -- its routes, its environment contract
      # and its unit -- so a server change that touches no installer file can
      # break it, and one did: 932b7831 left it red for two commits and nothing
      # said so. It reuses the binary built above, so it costs seconds.
      - name: Public installer smoke on the built binary
        run: |
          # The runner image ships no tmux; the smoke creates and removes its
          # own session on a disposable socket.
          if ! command -v tmux >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq tmux
          fi
          ./scripts/test-public-install.sh "$GITHUB_WORKSPACE/chrote-server-ci"

      - name: Weekly dependency scans
        if: github.event_name == 'schedule'
        run: |
          cd src
          go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
          cd ../dashboard
          npm audit --audit-level=moderate

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: quality-browser-failure
          path: |
            dashboard/playwright-report
            dashboard/test-results
            ${{ runner.temp }}/chrote-contract/server.log
          include-hidden-files: true
          if-no-files-found: warn
