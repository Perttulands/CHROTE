name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

# One serial job measured 5m46s, and 69% of it was the dashboard step waiting on
# a browser suite pinned to a single worker. The work splits along its real
# dependencies instead: only the jobs that compile the server need the embedded
# bundle, only the browser jobs need Chromium, and nothing else needs to wait.
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.classify.outputs.full }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Select documentation or full product checks
        id: classify
        run: |
          full="$(python3 scripts/ci-product-required.py)" || full=true
          if [ "$full" != false ]; then full=true; fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "Full product checks: $full" >> "$GITHUB_STEP_SUMMARY"

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Documentation and host neutrality
        run: |
          python3 scripts/doc-lint.py
          python3 scripts/host-neutrality.py

  # The dashboard bundle is embedded into the Go binary by a compile-time
  # directive and is not tracked, so every job that compiles the server needs
  # this one to have run. It publishes the bundle and the binary so no other job
  # rebuilds them.
  build:
    needs: changes
    if: ${{ always() && !cancelled() && needs.changes.outputs.full != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache-dependency-path: src/go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard
        run: npm ci --prefix dashboard

      - name: Build embedded dashboard and server
        run: |
          ./scripts/build-embedded-dashboard.sh
          ./scripts/build-server.sh "$GITHUB_WORKSPACE/chrote-server-ci"

      # The stamp travels with the bundle: check-embedded-dashboard.py needs both
      # and reports "bundle or stamp missing" if it gets only one.
      - name: Publish the embedded bundle
        uses: actions/upload-artifact@v7
        with:
          name: embedded-dashboard
          path: |
            src/internal/dashboard/dist
            src/internal/dashboard/dist.stamp
          include-hidden-files: true
          retention-days: 1

      - name: Publish the server binary
        uses: actions/upload-artifact@v7
        with:
          name: chrote-server
          path: chrote-server-ci
          retention-days: 1

  go:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache-dependency-path: src/go.sum

      # The embed directive fails to compile without a bundle on disk, so the
      # Go job takes the one build already produced rather than installing Node.
      - name: Take the embedded bundle
        uses: actions/download-artifact@v8
        with:
          name: embedded-dashboard
          path: src/internal/dashboard

      - name: Go format and vet
        run: |
          cd src
          unformatted="$(gofmt -l $(find . -name '*.go' -not -path './vendor/*'))"
          test -z "$unformatted" || { printf '%s\n' "$unformatted"; exit 1; }
          go vet ./...

      - name: Go race tests
        run: cd src && go test -race ./...

  # No browser, so no Chromium download: this job is Node and nothing else.
  unit:
    needs: changes
    if: ${{ always() && !cancelled() && needs.changes.outputs.full != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard
        run: npm ci --prefix dashboard

      - name: Beads launcher behavior
        run: python3 scripts/test-bd-wrapper.py

      - name: Dashboard unit tests and lint
        run: |
          cd dashboard
          npm run test:unit
          npm run lint

  browser:
    needs: changes
    if: ${{ always() && !cancelled() && needs.changes.outputs.full != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard and Chromium
        run: |
          npm ci --prefix dashboard
          cd dashboard
          npx playwright install --with-deps chromium

      # The worker count is the runner's, set in playwright.config.ts. Pinning it
      # to one serialised 282s of measured CPU into a single lane.
      - name: Mocked browser journeys
        run: cd dashboard && npm test

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-failure
          path: |
            dashboard/playwright-report
            dashboard/test-results
          include-hidden-files: true
          if-no-files-found: warn

  # The gates that guard the built product, run once against the binary the
  # build job produced.
  contracts:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Take the embedded bundle
        uses: actions/download-artifact@v8
        with:
          name: embedded-dashboard
          path: src/internal/dashboard

      - name: Take the server binary
        uses: actions/download-artifact@v8
        with:
          name: chrote-server

      - name: Install dashboard and Chromium
        run: |
          npm ci --prefix dashboard
          cd dashboard
          npx playwright install --with-deps chromium

      - name: Embedded dashboard contract
        run: python3 scripts/check-embedded-dashboard.py

      - name: Built server browser and API contract
        env:
          CHROTE_CONTRACT_ARTIFACT_DIR: ${{ runner.temp }}/chrote-contract
          CHROTE_SERVER_BINARY: ${{ github.workspace }}/chrote-server-ci
        run: |
          chmod +x chrote-server-ci
          ./scripts/test-built-server-contract.sh

      # Every full run verifies the installed product using the build artifact.
      # The health receipt must name the commit this workflow checked out.
      - name: Public installer smoke on the built binary
        env:
          CHROTE_EXPECTED_BUILD_COMMIT: ${{ github.sha }}
        run: |
          # The runner image ships no tmux; the smoke creates and removes its
          # own session on a disposable socket.
          if ! command -v tmux >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq tmux
          fi
          ./scripts/test-public-install.sh "$GITHUB_WORKSPACE/chrote-server-ci"

      - name: Upload contract failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: contract-failure
          path: |
            dashboard/playwright-report
            dashboard/test-results
            ${{ runner.temp }}/chrote-contract/server.log
          include-hidden-files: true
          if-no-files-found: warn

  result:
    name: CI result
    needs: [changes, docs, build, go, unit, browser, contracts]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every selected check
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          results = json.loads(os.environ["RESULTS"])
          full = results["changes"]["outputs"].get("full") != "false"
          expected = {"changes": "success", "docs": "success"}
          expected.update(dict.fromkeys(
              ["build", "go", "unit", "browser", "contracts"],
              "success" if full else "skipped",
          ))
          bad = [name for name, state in expected.items() if results[name]["result"] != state]
          if bad:
              raise SystemExit("Required CI results were not met: " + ", ".join(bad))
          print("Full product checks passed" if full else "Documentation checks passed; product checks were not required")
          PY
