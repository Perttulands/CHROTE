name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache-dependency-path: src/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Documentation contract
        run: python3 scripts/doc-lint.py

      - name: Dashboard install dependencies
        run: |
          cd dashboard
          npm ci

      - name: Dashboard build embedded assets
        run: ./scripts/build-embedded-dashboard.sh

      - name: Go format
        run: |
          cd src
          unformatted="$(gofmt -l $(find . -name '*.go' -not -path './vendor/*'))"
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi

      - name: Go vet
        run: |
          cd src
          go vet ./...

      - name: Go tests
        run: |
          cd src
          go test ./...

      - name: Go race tests
        run: |
          cd src
          go test -race ./...

      - name: Go coverage
        run: |
          cd src
          go test -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out

      - name: Go vulnerability scan
        run: |
          cd src
          go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Dashboard lint
        run: |
          cd dashboard
          npm run lint

      - name: Dashboard unit coverage
        run: |
          cd dashboard
          npm run test:unit -- --coverage

      - name: Dashboard dependency audit
        run: |
          cd dashboard
          npm audit --audit-level=moderate

      - name: Install Playwright browser
        run: |
          cd dashboard
          npx playwright install --with-deps chromium

      - name: Dashboard Playwright tests
        run: |
          cd dashboard
          npm test

      - name: Release package smoke
        run: |
          cd src
          go test ./...
          version="$(tr -d '\r\n' < ../VERSION)"
          go build -trimpath -ldflags "-X main.Version=$version" -o /tmp/chrote-server-ci ./cmd/server
          go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 -mode=binary /tmp/chrote-server-ci

      - name: Public installer smoke
        run: ./scripts/test-public-install.sh /tmp/chrote-server-ci
