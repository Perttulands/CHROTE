name: CI

on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache-dependency-path: src/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard and Chromium
        run: |
          npm ci --prefix dashboard
          cd dashboard
          npx playwright install --with-deps chromium

      - name: Build embedded dashboard and server
        run: |
          ./scripts/build-embedded-dashboard.sh
          cd src
          go build -trimpath -o ../chrote-server-ci ./cmd/server

      - name: Go format and vet
        run: |
          cd src
          unformatted="$(gofmt -l $(find . -name '*.go' -not -path './vendor/*'))"
          test -z "$unformatted" || { printf '%s\n' "$unformatted"; exit 1; }
          go vet ./...

      - name: Go race tests with coverage
        run: cd src && go test -race -coverprofile=coverage.out ./...

      - name: Dashboard unit, lint, and browser tests
        run: |
          cd dashboard
          npm run test:unit
          npm run lint
          npm test

      - name: Source contracts
        run: |
          python3 scripts/doc-lint.py
          python3 scripts/host-neutrality.py
          python3 scripts/check-embedded-dashboard.py
          dead="$(cd src && go run golang.org/x/tools/cmd/deadcode@latest ./cmd/server)"
          test -z "$dead" || { printf '%s\n' "$dead"; exit 1; }
          if grep -R -n --include='*.go' 't\.Skip(' src; then
            exit 1
          fi

      - name: Built server browser and API contract
        env:
          CHROTE_CONTRACT_ARTIFACT_DIR: ${{ runner.temp }}/chrote-contract
          CHROTE_SERVER_BINARY: ${{ github.workspace }}/chrote-server-ci
        run: ./scripts/test-built-server-contract.sh

      - name: Weekly dependency scans
        if: github.event_name == 'schedule'
        run: |
          cd src
          go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
          cd ../dashboard
          npm audit --audit-level=moderate

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: quality-browser-failure
          path: |
            dashboard/playwright-report
            dashboard/test-results
            ${{ runner.temp }}/chrote-contract/server.log
          include-hidden-files: true
          if-no-files-found: warn
